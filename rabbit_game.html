<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101f26">
<title>兔耳狂拍</title>
<link rel="icon" type="image/webp" href="assets/ui/home/wardrobe.webp">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
:root{--o:#2b2140;--cream:#fffaf0;--green:#52ec22;--pink:#ff8fbd;--yel:#ffe45e;--red:#ff4d5e;--blue:#4dc3ff}
html,body{margin:0;height:100%;background:#12141c;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif}
#game{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,56.25vh);height:100%;overflow:hidden;background:#3c4252}
#game:focus{outline:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#c{pointer-events:none}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
.scroll,.scroll *{touch-action:pan-y}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* ---------- 通用组件 ---------- */
.btn{pointer-events:auto;border:3.5px solid var(--o);border-radius:16px;font:900 18px/1 "PingFang SC",sans-serif;padding:14px 0;width:100%;color:#fff;background:var(--o);box-shadow:0 5px 0 var(--o);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--o)}
.btn.green{background:var(--green);color:var(--o)}
.btn.red{background:var(--red)}
.btn.yel{background:var(--yel);color:var(--o)}
.btn.blue{background:var(--blue);color:var(--o)}
.btn.pink{background:var(--pink);color:var(--o)}
.btn.sm{font-size:14px;padding:10px 0;border-radius:13px;box-shadow:0 4px 0 var(--o)}
.btn[disabled],.btn.off{filter:grayscale(.85) brightness(.9);opacity:.75;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:5px;background:#fff;color:var(--o);border:3px solid var(--o);border-radius:16px;box-shadow:0 3px 0 var(--o);font:900 15px/1 sans-serif;padding:6px 11px}
.round{width:42px;height:42px;border-radius:50%;border:3.5px solid var(--o);background:#fff;color:var(--o);font:900 18px/1 sans-serif;box-shadow:0 4px 0 var(--o);display:flex;align-items:center;justify-content:center;padding:0;pointer-events:auto}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--o)}
.card{background:var(--cream);border:4px solid var(--o);border-radius:24px;box-shadow:0 8px 0 var(--o),0 14px 30px #0006;text-align:center;padding:18px 16px 16px;animation:rise .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{from{transform:scale(.6);opacity:0}}
.ttl{margin:0;color:#fff;font:900 22px/1 "PingFang SC",sans-serif;-webkit-text-stroke:5px var(--o);paint-order:stroke fill;letter-spacing:1px}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:10}
.topbar{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px;z-index:3;pointer-events:none}
.topbar>*{pointer-events:auto}
.topbar .mid{flex:1;text-align:center;pointer-events:none}

/* ---------- 战斗 HUD ---------- */
#hud{
  --ink:#392b36;--paper:#fff9e9;--pink:#ff9bb3;--mint:#ace8c8;
  --hud-top:max(13px,calc(env(safe-area-inset-top,0px) + 5px));--hud-left:max(13px,calc(env(safe-area-inset-left,0px) + 8px));
  --hud-right:max(21px,calc(env(safe-area-inset-right,0px) + 11px));--hud-bottom:max(23px,calc(env(safe-area-inset-bottom,0px) + 11px));
  position:absolute;inset:0;pointer-events:none;color:var(--ink);font-variant-numeric:tabular-nums;
}
#hudPanel{position:absolute;left:var(--hud-left);top:var(--hud-top);width:clamp(179px,50vw,209px);max-width:calc(100% - 107px)}
.scoreTicket{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;background:var(--paper);border:2px solid var(--ink);border-radius:13px 17px 12px 14px;box-shadow:2px 3px 0 var(--ink);min-height:51px}
#pauseBtn{position:relative;align-self:stretch;width:44px;min-height:45px;padding:3px 0;border:0;border-right:2px dashed #ad895f;border-radius:11px 0 0 10px;background:#ffdb99;color:var(--ink);pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pauseGlyph{width:24px;height:21px;display:flex;align-items:center;justify-content:center;gap:3px;border-radius:6px;background:var(--ink)}
.pauseGlyph i{width:3.5px;height:11px;border-radius:.8px;background:#fff9e9}
.pauseWord{font:800 10.5px/1.1 system-ui;letter-spacing:.03em}
#pauseBtn:active,#pauseBtn[aria-expanded="true"]{background:#efc27f}
#pauseBtn:active .pauseGlyph{transform:translateY(1px);background:#644a3e}
#hud #pauseBtn:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
.scoreMain{min-width:0;padding:4px 9px 6px}
#hudReadout,.levelLine{display:flex;align-items:center;justify-content:space-between;gap:5px}
#score{white-space:nowrap;transform-origin:10% 75%;font:900 clamp(23px,6.7vw,32px)/1 "Arial Rounded MT Bold",system-ui,sans-serif;letter-spacing:-1.4px}
#score small{margin-left:3px;font:750 11px/1 system-ui;letter-spacing:0}
#score.wide{font-size:clamp(20px,5.5vw,26px);letter-spacing:-.8px}
#carrot{display:flex;align-items:center;gap:5px;white-space:nowrap;font:800 12px/1 system-ui}
.levelLine{margin-top:3px;gap:5px}
#lvTag{white-space:nowrap;font:800 10px/1 system-ui;color:#634f46}
#xpbar{flex:1;height:5px;border-radius:3px;background:#e4d6bd;overflow:hidden}
#xpbar i,#wbar i,.threatStrip i{display:block;height:100%;transition:width .16s}
#xpbar i{background:#549678}
.waveTicket{margin:4px 2px 0 6px;padding:4px 8px;display:flex;align-items:center;justify-content:space-between;gap:4px;min-height:21px;color:#fff7e4;background:var(--ink);border-radius:4px 5px 8px 8px;font:700 11px/1.2 system-ui}
#sub{white-space:nowrap}#runClock{color:#ffdfa9;font-size:12px;font-weight:800}
#wbar{position:relative;height:4px;margin:2px 9px 0;border-radius:3px;overflow:hidden;background:#6b5b63}
#wbar i{background:#ffc275}#wbar b{position:absolute;top:0;bottom:0;width:2px;background:#fff0cd}#wbar span{display:none}
.threatStrip{position:relative;margin:5px 1px 0 5px;height:21px;border-radius:8px;border:2px solid var(--ink);background:#513943;color:#fff;overflow:hidden;box-shadow:1px 2px 0 var(--ink)}
.threatStrip span{position:absolute;inset:0;text-align:center;font:800 11px/17px system-ui;text-shadow:0 1px 2px #301427}
#mob:not(.on){display:none}#mob i{background:#ae5844}#boss i{background:#943c5e}#mob.warn{animation:warnBeat .55s ease-in-out infinite}
@keyframes warnBeat{50%{box-shadow:0 0 0 2px #ffbb79}}
#attackDock{position:absolute;right:var(--hud-right);bottom:var(--hud-bottom);display:flex;align-items:center;flex-direction:column;gap:5px}
.actionKey{pointer-events:auto;position:relative;isolation:isolate;border:2.5px solid var(--ink);color:var(--ink);background:var(--paper);box-shadow:2px 4px 0 var(--ink);padding:0;font-family:inherit}
.actionKey:active{transform:translateY(3px);box-shadow:1px 1px 0 var(--ink)}
.actionKey:focus-visible,#pauseBtn:focus-visible{outline:3px solid #fff;outline-offset:4px}
#spinBtn{width:82px;height:71px;border-radius:46% 46% 40% 40% / 49% 49% 37% 37%;background:#fff5e9}
.toe{position:absolute;top:6px;left:14px;width:12px;height:15px;border:1.5px solid var(--ink);border-radius:55%;background:var(--pink);transform:rotate(-22deg)}
.toe.middle{left:33px;top:3px;width:13px;height:17px;transform:rotate(-3deg)}.toe.end{left:53px;top:7px;transform:rotate(22deg)}
.pawPad{position:absolute;bottom:5px;left:8px;right:8px;height:35px;background:var(--pink);border:1.5px solid var(--ink);border-radius:52% 52% 36% 36% / 67% 67% 36% 36%;display:grid;place-items:center}
.actionKey strong{white-space:nowrap;font:850 15px/1.1 system-ui}
.actionLabel{display:flex;align-items:center;flex-direction:column;gap:2px}.actionLabel small{display:none;font:750 10px/1 system-ui;color:#654858}
.actionKey.cooling .actionLabel small,.actionKey.active .actionLabel small{display:block}
.actionKey.cooling .pawPad strong,.actionKey.active .pawPad strong{font-size:14px}
#spinBtn strong{font-size:18px}.keyCap{display:none}
#spBtn{position:absolute;bottom:var(--hud-bottom);left:max(21px,calc(env(safe-area-inset-left,0px) + 11px));min-width:106px;height:50px;padding:0 12px 0 6px;border-radius:23px 16px 16px 23px;display:flex;align-items:center;gap:6px;background:var(--mint)}
.skillMark{position:relative;display:grid;place-items:center;width:32px;height:32px;flex:none;background:#fff8e6;border:1.5px solid var(--ink);border-radius:50%;transform:rotate(-8deg)}
.skillMark::before{content:"";width:18px;height:17px;background:var(--ink);clip-path:polygon(39% 0,89% 0,65% 38%,99% 38%,26% 100%,43% 56%,6% 56%)}
#spBtn[data-id="quake"] .skillMark::before{clip-path:polygon(50% 0,96% 50%,74% 50%,74% 72%,28% 72%,28% 50%,5% 50%)}#spBtn[data-id="quake"] .skillMark::after{content:"";position:absolute;bottom:6px;width:14px;height:2px;background:var(--ink)}
#spBtn[data-id="shield"] .skillMark::before{clip-path:polygon(50% 0,96% 19%,84% 70%,50% 100%,15% 70%,4% 19%)}
.actionKey.cooling{background:#ebe0d6}.actionKey.cooling .pawPad,.actionKey.cooling .toe{background:#d9c4cc}
.actionKey.cooling .skillMark{background:#e2d6c8}.actionKey.cooling .skillMark::before,.actionKey.cooling .skillMark::after{opacity:.50}
.actionKey.active .pawPad{background:#ffd17c}.actionKey.active .toe{background:#ffac86}
.actionKey.active .pawPad strong{font-size:15px}
#fev{width:76px;height:14px;display:flex;align-items:center;gap:4px;color:white;border-radius:8px;background:var(--ink);padding:1px 5px;font:750 9px/1 system-ui}
#fev span{flex:none}#fev b{display:block;flex:1;height:5px;background:#776570;border-radius:4px;overflow:hidden}
#fev i{display:block;height:100%;background:#ffc373;border-radius:4px;transition:width .12s linear}
#fev.on{color:var(--ink);background:#ffdd7d}#fev.on b{background:#bc8152}#fev.on i{background:#a84b29}
#toast,#wave{position:absolute;left:12%;right:12%;top:calc(var(--hud-top) + 128px);text-align:center;pointer-events:none;opacity:0;z-index:4;color:var(--ink)}
#toast{font:850 17px/1.25 system-ui;color:#fff1ae;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
#toast.show{animation:toast 1.1s ease-out}
#wave b,#wave span{display:table;margin:auto}#wave b{padding:3px 11px;transform:rotate(-3deg);background:#ffe098;border:2px solid var(--ink);border-radius:8px;box-shadow:1px 3px 0 var(--ink);font:900 21px/1.12 system-ui}
#wave span{margin-top:6px;padding:2px 7px;border-radius:5px;background:var(--ink);color:var(--paper);font:700 12px/1.3 system-ui}
#wave.show{animation:wv 2.3s ease-out}#wave.show~#toast{visibility:hidden}#wave span:empty{display:none}
@keyframes toast{0%,100%{opacity:0}15%,76%{opacity:1}100%{transform:translateY(-8px)}}
@keyframes wv{0%{opacity:0;transform:scale(.82)}12%,79%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-10px)}}
#hud.late::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 35px 7px #b61f303b;pointer-events:none}
@media(pointer:fine){.keyCap{display:block;position:absolute;top:-8px;right:0;border-radius:5px;border:1px solid var(--ink);background:var(--paper);padding:2px 4px;color:var(--ink);font:700 9px/1 system-ui}}
@media(max-width:350px){.scoreMain{padding-left:6px;padding-right:6px}.waveTicket{padding-inline:5px}#spinBtn{width:77px}#spBtn{min-width:100px}}
@media(prefers-reduced-motion:reduce){#mob.warn,#score.pop{animation:none}}
.sec{font:900 15px/1 "PingFang SC",sans-serif;color:#fff;-webkit-text-stroke:4px var(--o);paint-order:stroke fill;margin:10px 4px 8px;display:flex;align-items:baseline;justify-content:space-between}
.sec small{font:800 11px sans-serif;-webkit-text-stroke:3px var(--o);opacity:.9}
.li .pg{font:900 12px/1.35 sans-serif;color:var(--o);text-align:center;width:66px;flex:none}
@keyframes pulse{50%{transform:scale(1.07)}}

/* ---------- 主页 ---------- */
.speakerMark{position:relative;width:21px;height:18px;display:block}
.speakerMark::before{content:"";position:absolute;left:0;top:2px;width:13px;height:15px;background:currentColor;clip-path:polygon(0 34%,36% 34%,86% 0,98% 0,98% 100%,86% 100%,36% 67%,0 67%)}
.speakerMark::after{content:"";position:absolute;width:10px;height:13px;top:2px;right:0;border-right:2px solid;border-radius:50%}
[aria-pressed="false"] .speakerMark::after{width:8px;height:10px;top:4px;right:0;border:0;border-radius:0;background:linear-gradient(45deg,transparent 42%,currentColor 43% 56%,transparent 57%),linear-gradient(-45deg,transparent 42%,currentColor 43% 56%,transparent 57%)}
.row{display:flex;gap:10px;width:100%}
.row>*{flex:1}

/* ---------- 子页面通用 ---------- */
.scr{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column}
.scr .head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px}
.scr .head .ttl{flex:1;text-align:center}
.shade{background:linear-gradient(#1b1630ee,#2b2140f2)}
.sheet{margin-top:auto;background:var(--cream);border:4px solid var(--o);border-bottom:0;border-radius:26px 26px 0 0;box-shadow:0 -6px 24px #0006;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:10px;max-height:58%}
.tabs{display:flex;gap:8px}
.tab{flex:1;border:3px solid var(--o);border-radius:14px;background:#fff;color:var(--o);font:900 14px/1 sans-serif;padding:10px 0;box-shadow:0 3px 0 var(--o);pointer-events:auto}
.tab.on{background:var(--yel)}
.tab.lock{opacity:.55;filter:grayscale(1)}

/* ---------- 关卡选择 ---------- */
#lvsel{background:linear-gradient(var(--sk1,#4a7fd0),var(--sk2,#9ec8f0))}
#lvsel .maps{display:flex;gap:7px;padding:0 12px}
#lvsel .maps .tab{font-size:12px;padding:8px 0;display:flex;flex-direction:column;gap:4px;align-items:center}
#lvsel .maps .tab span{font-size:20px}
#mapInfo{margin:8px 12px 0;background:#0005;border-radius:14px;padding:9px 12px;color:#fff;font:700 12px/1.45 sans-serif;text-align:left}
#mapInfo b{font-size:15px}
#path{position:relative;flex:1;margin:6px 0 0}
#path svg{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.node{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:4px solid var(--o);background:var(--yel);color:var(--o);font:900 26px/1 sans-serif;box-shadow:0 5px 0 var(--o);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;pointer-events:auto}
.node:active{transform:translateY(3px);box-shadow:0 2px 0 var(--o)}
.node small{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:-1px;white-space:nowrap;color:#ffe45e;-webkit-text-stroke:3px var(--o);paint-order:stroke fill}
.node.boss{width:82px;height:82px;margin:-41px 0 0 -41px;background:#ff6a5d;color:#fff;-webkit-text-stroke:4px var(--o);paint-order:stroke fill;font-size:30px}
.node.lock{background:#8d8aa0;color:#d8d5e6;-webkit-text-stroke:0;filter:none}
.node.cur{animation:pulse 1.1s infinite;background:var(--green)}
.node .nm{position:absolute;top:-19px;left:50%;transform:translateX(-50%);white-space:nowrap;font:800 11px/1 sans-serif;color:#fff;-webkit-text-stroke:3px var(--o);paint-order:stroke fill}
#brief{background:#000b;z-index:20}
#brief .card{width:84%;max-width:340px;text-align:left}
#brief h3{margin:0 0 4px;font:900 22px/1.1 sans-serif;color:var(--o);text-align:center}
#brief .obj{background:#fff;border:3px solid var(--o);border-radius:14px;padding:9px 11px;font:900 16px/1.3 sans-serif;color:var(--o);text-align:center;margin:8px 0}
#brief .st{display:flex;align-items:center;gap:8px;font:700 13px/1.35 sans-serif;color:#555;margin:6px 2px}
#brief .st i{font-style:normal;font-size:20px;filter:grayscale(1) opacity(.45)}
#brief .st.on i{filter:none}
#brief .st.on{color:var(--o);font-weight:900}
#brief .tip{font:700 12px/1.4 sans-serif;color:#d2562f;margin:6px 2px 10px}
#brief .meta{display:flex;justify-content:center;gap:8px;font:800 12px/1 sans-serif;color:#666;margin-bottom:2px}

/* ---------- 衣橱 / 特技升级 ---------- */
#ward{background:none}
.skgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.detail{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--o);border-radius:16px;padding:9px 10px}
.detail .tx{flex:1;text-align:left;color:var(--o)}
.detail .tx b{display:block;font:900 16px/1.2 sans-serif}
.detail .tx span{font:700 12px/1.3 sans-serif;color:#666}
.detail .btn{width:104px;flex:none}
.list{display:flex;flex-direction:column;gap:9px}
.li{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--o);border-radius:16px;padding:9px 10px;color:var(--o);text-align:left}
.li .ic{width:46px;height:46px;flex:none;border-radius:14px;background:var(--yel);border:3px solid var(--o);display:flex;align-items:center;justify-content:center;font-size:25px}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font:900 15px/1.2 sans-serif}
.li .tx span{display:block;font:700 11.5px/1.35 sans-serif;color:#666}
.li .btn{width:94px;flex:none;padding:10px 0;font-size:13px}
.pips{display:flex;gap:3px;margin-top:5px}
.pips i{width:16px;height:8px;border-radius:4px;background:#ddd;border:2px solid var(--o)}
.pips i.f{background:var(--green)}
.li.done{background:#f0ffe8}
.bar2{height:9px;border-radius:5px;border:2px solid var(--o);background:#eee;margin-top:5px;overflow:hidden}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff9a3d)}

/* ---------- 局内升级 / 暂停 / 结算 ---------- */
#cards{background:#000a;z-index:15;gap:14px;padding:0 20px}
#cards h2{margin:0 0 4px;font-size:26px}
.cc{display:flex;align-items:center;gap:12px;width:100%;max-width:330px;background:var(--cream);border:4px solid var(--o);border-radius:20px;box-shadow:0 6px 0 var(--o);padding:11px 13px;text-align:left;color:var(--o);pointer-events:auto;animation:rise .35s cubic-bezier(.2,1.4,.4,1) backwards}
.cc:nth-child(3){animation-delay:.06s}.cc:nth-child(4){animation-delay:.12s}
.cc:active{transform:translateY(4px);box-shadow:0 2px 0 var(--o)}
.cc .ic{width:54px;height:54px;flex:none;border-radius:16px;background:var(--yel);border:3px solid var(--o);display:flex;align-items:center;justify-content:center;font-size:30px}
.cc b{display:block;font:900 18px/1.2 sans-serif}
.cc span{display:block;font:700 13px/1.35 sans-serif;color:#555;margin-top:2px}
.cc em{font-style:normal;font:900 11px/1 sans-serif;color:#d2562f;display:block;margin-top:4px}
#pause{background:#000a;z-index:15}
#pause .card{width:74%;max-width:300px;display:flex;flex-direction:column;gap:10px}
#pause h3,#help h3{margin:0 0 4px;font:900 22px/1 sans-serif;color:var(--o)}
#over{background:linear-gradient(#0000 20%,#0008);justify-content:flex-end;padding-bottom:6%;z-index:12}
#over .card{width:80%;max-width:330px}
#over .rib{display:inline-block;margin:-34px 0 8px;padding:9px 26px;border:4px solid var(--o);border-radius:14px;background:var(--green);font:900 26px/1 sans-serif;color:var(--o);box-shadow:0 4px 0 var(--o)}
#over .rib.lose{background:#ff6a5d;color:#fff}
#over .big{font:900 54px/1 "Arial Black","PingFang SC",sans-serif;color:var(--o)}
#over .big small{font-size:32px}
#over .rank{font:900 16px/1.3 sans-serif;color:var(--red);margin:6px 0 2px}
#over .tip{font:700 12.5px/1.45 sans-serif;color:#666;margin-bottom:8px}
#over .stars{font-size:44px;letter-spacing:4px;margin:2px 0 6px;color:#ffb800;-webkit-text-stroke:3px var(--o);paint-order:stroke fill}
#over .stars s{text-decoration:none;display:inline-block}
#over .stars s.no{color:#ddd}
#over .stars s.pop{animation:starpop .5s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes starpop{from{transform:scale(2.6) rotate(-30deg);opacity:0}}
#over .stats{display:flex;justify-content:space-around;margin:6px 0 8px;font:900 18px/1.2 sans-serif;color:var(--o)}
#over .stats span{display:block;font:700 11px/1.2 sans-serif;color:#888}

<script id="street-rules">
'use strict';
// 地块、路缘和碰撞共享世界坐标。跨街的空隙在每个路口连续。
const Street = (() => {
  const period=560, edge=850, cache=new Map();
  let district=0;
  function setMap(map){ if(map!==district){district=map;cache.clear();} }
  function road(y){
    const p=district*.82;
    return {center:52*Math.sin(y*.004+p)+19*Math.sin(y*.009-p),
      half:143+25*Math.cos(y*.0055+p)+11*Math.sin(y*.012-p)};
  }
  function buildings(row) {
    if(cache.has(row)) return cache.get(row);
    const lots=[];
    for(let slot=0;slot<2;slot++) for(const side of [-1,1]){
      const ordinal=row*4+slot*2+(side+1)/2, key=ordinal+district*7;
      const roll=(n)=>{const v=Math.sin(key*73.37+n*41.61+4.7)*43758.5453;return v-Math.floor(v);};
      const y0=row*period+(slot?416+roll(1)*12:75+roll(1)*38);
      const y1=row*period+(slot?485+roll(2)*22:285+roll(2)*19);
      const mid=(y0+y1)/2, limit=Math.max(...[y0,mid,y1].map(y=>{const r=road(y);return r.half+side*r.center;}));
      const inner=limit+18+roll(3)*46,mainWidth=100+roll(4)*94;
      const terrace=slot===0 || roll(8)>.44;
      const wing=terrace?Math.max(0,Math.min(532-inner-mainWidth,64+roll(9)*56)):0,outer=inner+mainWidth+wing;
      // Six architectural silhouettes cycle independently of wall and roof colours.
      const kind=((key*5+Math.floor(row/2)+6)%6+6)%6;
      lots.push({side,row,slot,kind,wing,paint:((key+Math.floor(roll(5)*3))%8+8)%8,accent:roll(6),scale:roll(7),
        x0:side<0?-outer:inner,x1:side<0?-inner:outer,y0,y1});
    }
    // Beyond the parallel street, irregular groups of shops alternate with open squares.
    for(const side of [-1,1]){
      const key=row*17+(side>0?7:3)+district*5;
      if(((key%4)+4)%4===0)continue;
      const front=lots[side<0?0:1],offset=front.accent*72;
      const inner=753+offset*.28, outer=inner+70+front.scale*21;
      lots.push({...front,wing:0,slot:2,kind:(front.kind+2)%6,paint:(front.paint+3)%8,
        x0:side<0?-outer:inner,x1:side<0?-inner:outer,
        y0:row*period+93+offset,y1:row*period+235+offset*1.6});
    }
    if(cache.size>64)cache.delete(cache.keys().next().value);
    cache.set(row,lots);return lots;
  }
  function block(x,y,radius){
    if(Math.abs(x)<65-radius || Math.abs(x)>edge+radius)return null;
    const first=Math.floor((y-radius)/period),last=Math.floor((y+radius)/period);
    for(let row=first;row<=last;row++) for(const b of buildings(row))
      if(x>b.x0-radius && x<b.x1+radius && y>b.y0-radius && y<b.y1+radius)return b;
    return null;
  }
  function free(x,y,radius=15,out={}){
    x = Math.max(-edge+radius, Math.min(edge-radius,x));
    const b = block(x,y,radius);
    if(!b){out.x=x;out.y=y;return out;}
    const choices = [[b.x0-radius,y],[b.x1+radius,y],[x,b.y0-radius],[x,b.y1+radius]];
    choices.sort((a,c) => Math.hypot(a[0]-x,a[1]-y)-Math.hypot(c[0]-x,c[1]-y));
    const clear=choices.find(([cx,cy])=>Math.abs(cx)<=edge-radius && !block(cx,cy,radius)) || [b.side<0?b.x1+radius:b.x0-radius,y];
    out.x=clear[0];out.y=clear[1];return out;
  }
  const moveEnd={x:0,y:0};
  function move(p, dx, dy, radius) {
    free(p.x,p.y,radius,p);
    const endX=Math.max(-edge+radius,Math.min(edge-radius,p.x+dx));
    let nx=endX===p.x+dx?0:-Math.sign(dx), ny=0;
    dx=endX-p.x;
    // Sweep the full displacement first; the unused part can still slide along the contacted face.
    for(let pass=0;pass<2 && (dx || dy);pass++){
      const end=moveEnd;end.x=p.x+dx;end.y=p.y+dy;
      const b=firstWall(p,end,radius);
      if(!b){p.x=end.x;p.y=end.y;break;}
      const t=intercept(p,end,b,radius);
      p.x+=t*dx;p.y+=t*dy;
      const touchX=dx && Math.abs(p.x-(dx>0?b.x0-radius:b.x1+radius))<.001;
      const touchY=dy && Math.abs(p.y-(dy>0?b.y0-radius:b.y1+radius))<.001;
      if(touchX){nx=-Math.sign(dx);dx=0;}else dx*=1-t;
      if(touchY){ny=-Math.sign(dy);dy=0;}else dy*=1-t;
      if(!touchX && !touchY) break;
    }
    return {nx,ny};
  }
  function clipEar(a,end,radius){
    const b=firstWall(a,end,radius);
    let fraction=b?intercept(a,end,b,radius):1;
    const dx=end.x-a.x;
    if(dx>0) fraction=Math.min(fraction,(edge-radius-a.x)/dx);
    else if(dx<0) fraction=Math.min(fraction,(-edge+radius-a.x)/dx);
    return Math.max(0,Math.min(1,fraction));
  }
  // 线段与扩张后的墙面相交的参数；沿边缘行走允许相切。
  function intercept(a, z, b, r) {
    let lo=0, hi=1;
    const dx=z.x-a.x, dy=z.y-a.y;
    if (Math.max(a.x,z.x)<=b.x0-r || Math.min(a.x,z.x)>=b.x1+r ||
        Math.max(a.y,z.y)<=b.y0-r || Math.min(a.y,z.y)>=b.y1+r) return Infinity;
    if (dx) { const s=(b.x0-r-a.x)/dx, t=(b.x1+r-a.x)/dx; lo=Math.max(lo,Math.min(s,t)); hi=Math.min(hi,Math.max(s,t)); }
    if (dy) { const s=(b.y0-r-a.y)/dy, t=(b.y1+r-a.y)/dy; lo=Math.max(lo,Math.min(s,t)); hi=Math.min(hi,Math.max(s,t)); }
    return hi>lo+.00001 ? lo : Infinity;
  }
  function firstWall(a,z,r) {
    const minX=Math.min(a.x,z.x), maxX=Math.max(a.x,z.x);
    if ((minX>-65+r && maxX<65-r) || minX>edge+r || maxX< -edge-r) return null;
    let first=null, nearest=Infinity;
    const begin=Math.floor((Math.min(a.y,z.y)-r)/period), end=Math.floor((Math.max(a.y,z.y)+r)/period);
    for(let row=begin;row<=end;row++) for(const b of buildings(row)) {
      const t=intercept(a,z,b,r); if(t<nearest){ nearest=t; first=b; }
    }
    return first;
  }
  function next(a, goal, radius) {
    const b=firstWall(a,goal,radius);
    if(!b) return goal;
    const margin=radius+12, corners=[
      {x:b.x0-margin,y:b.y0-margin},{x:b.x1+margin,y:b.y0-margin},
      {x:b.x1+margin,y:b.y1+margin},{x:b.x0-margin,y:b.y1+margin}
    ];
    const distance=(s,t)=>Math.hypot(s.x-t.x,s.y-t.y);
    let best=Infinity, target=goal;
    for(let i=0;i<4;i++){
      const c=corners[i];
      if(intercept(a,c,b,radius)<Infinity) continue;
      const approach=distance(a,c);
      for(const j of [i,(i+1)%4,(i+3)%4]){
        const out=corners[j]; if(intercept(out,goal,b,radius)<Infinity) continue;
        const cost=approach+distance(c,out)+distance(out,goal);
        if(cost<best){best=cost; target=approach<6 ? out : c;}
      }
    }
    return target;
  }
  return {period, edge, road, setMap, buildings, block, free, move, next, firstWall, clipEar};
})();
function pressureStage(t){return t<60?0:t<150?1:t<240?2:3;}
function endlessPressure(t) {
  const stage=pressureStage(t);
  const wave=t<60?Math.floor(t/30):2+Math.floor((t-60)/45);
  const late=Math.max(0,wave-5), growth=Math.log1p(late*.15);
  return {stage,wave,health:1+late*.23+late*late*.012, speed:1+.045*Math.min(wave,5)+growth*.40,
    grabPenalty:stage===3?1+Math.floor(late/3):0,
    cap:Math.min(78,18+wave*7), interval:.13+.46/(1+.36*wave),
    combo:t<180?1:Math.max(.65,.88-growth*.05), drain:t<180?1:1.5+growth*.2};
}
</script>
<script>
'use strict';
/* ========== 基础 ========== */
const $ = id => document.getElementById(id);
const gameEl = $('game'), cv = $('c'), ctx = cv.getContext('2d');
let w = 360, h = 640, dpr = 1, U = 1, CX = 180, CY = 400;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[(Math.random() * a.length) | 0];
const TAU = Math.PI * 2;

const glc = $('gl');
let dprGL = 1, overlayStatic=false;
function updateHostInsets(){
  // A host may expose a native capsule in viewport coordinates even when CSS reports zero insets.
  const host=window.wx, box=gameEl.getBoundingClientRect();
  let capsule, safe;
  try {capsule=host?.getMenuButtonBoundingClientRect?.();safe=host?.getWindowInfo?.().safeArea;} catch {}
  const set=(name,value)=>gameEl.style.setProperty(name,Math.max(0,value || 0)+'px');
  set('--host-top',safe?.top-box.top);set('--host-bottom',box.bottom-(safe?.bottom??box.bottom));
  set('--host-left',safe?.left-box.left);set('--host-right',box.right-(safe?.right??box.right));
  if(capsule?.width>0 && capsule.bottom>box.top && capsule.left<box.right && capsule.right>box.left){
    gameEl.classList.toggle('capsule-tight',capsule.left-box.left<200);
    set('--capsule-bottom',capsule.bottom-box.top+8);set('--capsule-width',box.right-capsule.left+8);
  }else{gameEl.classList.remove('capsule-tight');gameEl.style.removeProperty('--capsule-bottom');gameEl.style.removeProperty('--capsule-width');}
}
function resize() {
  updateHostInsets();
  dpr = Math.min(window.devicePixelRatio || 1, 2); dprGL = Math.min(window.devicePixelRatio || 1, 2);
  const host=cv.parentElement;
  w=host.clientWidth || 360;h=host.clientHeight || 640;
  overlayStatic=false;
  if(cv.width!==Math.round(w*dpr))cv.width=Math.round(w*dpr);
  if(cv.height!==Math.round(h*dpr))cv.height=Math.round(h*dpr);        // 2D 叠加层（飘字/粒子/摇杆）
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if(glc.width!==Math.round(w*dprGL))glc.width=Math.round(w*dprGL);
  if(glc.height!==Math.round(h*dprGL))glc.height=Math.round(h*dprGL);   // WebGL 3D 画面
  U = 1;
}
window.addEventListener('resize', resize);
resize();
// Keep the live demo behind the title art as a fallback for missing artwork.
const homeScene=$('homeScene'),menuCover=new Image();
let coverReady=false;
menuCover.onload=()=>{coverReady=true;};
menuCover.src='assets/ui/street-cover.webp';
function mountHomeScene(on){
  gameEl.classList.toggle('homeView',on);
  const host=on?homeScene:gameEl;
  if(cv.parentElement!==host){
    const before=on?null:$('hud');
    host.insertBefore(glc,before);host.insertBefore(cv,before);resize();
  }
}
if(typeof ResizeObserver!=='undefined'){
  new ResizeObserver(()=>{if(cv.parentElement===homeScene) resize();}).observe(homeScene);
}

let camX = 0, camY = 0;        // 相机跟随点（世界坐标，sim 平面：x 向右，y 向前）

/* ========== 输入：浮动摇杆 + 键盘 ========== */
const joy = { on: false, id: -1, ox: 0, oy: 0, kx: 0, ky: 0, x: 0, y: 0, shown: false };
const keys = {};
function canvasPos(e) { const r = gameEl.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
gameEl.addEventListener('pointerdown', e => {
  if (e.target.closest('button') || state !== 'play' || paused || cardOpen) return;
  if (joy.on) return;
  audio();

  // footfall and impacts even while the browser is waiting for a sound gesture.
  const source=synthesizeFoley.toString()+`
    onmessage=({data:{sounds,rate}})=>{
      for(const [name,tone] of Object.entries(sounds))for(let take=0;take<3;take++){
        const samples=synthesizeFoley(name,take,tone,rate);
        postMessage({key:name+take,samples},[samples.buffer]);

  const root=song.root+offset, notes=[0,third,7,12], unit=15/song.bpm;
  if(beat===0 || beat===8){

    for(let i=0;i<2;i++) bgTone(mtof(root+notes[1+i]),unit*5,.056,when+.024+i*.035);

  if(mode!==BGM.mode){BGM.mode=mode;BGM.step=0;BGM.next=AC.currentTime+.08;}

const dayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
function ensureDaily() {
  const k = dayKey(); if (SAVE.daily && SAVE.daily.d === k) return SAVE.daily;
  let s = 0; for (const c of k) s = (s * 31 + c.charCodeAt(0)) >>> 0;
  const ids = []; while (ids.length < 3) { s = (s * 1103515245 + 12345) >>> 0; const q = (s >>> 8) % DAILY_POOL.length; if (!ids.includes(q)) ids.push(q); }
  const base = {}; DAILY_POOL.forEach(q => base[q.stat] = statVal(q.stat));
  SAVE.daily = { d: k, q: ids, base, got: [0, 0, 0] }; saveNow(); return SAVE.daily;
}

// Construct each link on a sphere around its parent. A blocked link folds upward along
// the wall. The same joint positions feed the collision, the ribbon mesh and its trail.
const earEnd={x:0,y:0};
function placeEarLink(a,p,length){
  const x=a.x+p.ux*length,y=a.y+p.uy*length;
  earEnd.x=x;earEnd.y=y;
  const fraction=PREV_SKIN?1:Street.clipEar(a,earEnd,EAR_CLEARANCE);
  const dx=(x-a.x)*fraction,dy=(y-a.y)*fraction;
  let height=length*p.uh;
  if(fraction<.99999) height=Math.sqrt(Math.max(0,length*length-dx*dx-dy*dy));
  if(a.h+height<9) height=Math.abs(height);
  p.x=a.x+dx;p.y=a.y+dy;p.h=a.h+height;
}
function anchorEar(e){
  const base=earBase(e.side),p=e.pts,linkLength=earLinkLength();
  p[0].x=base.x;p[0].y=base.y;p[0].h=base.h;
  for(let i=1;i<EN;i++) placeEarLink(p[i-1],p[i],linkLength);
}
function hangsLow(carriage,side){ return carriage==='lop' || (carriage==='oneLop' && side>0); }
function standsTall(carriage,side){
  return carriage==='tall' || carriage==='fan' || carriage==='open' || (carriage==='tilted' && side<0);
}
const earRestCache=new Map();
function restSections(carriage,side){
  const key=carriage+side;
  let sections=earRestCache.get(key);
  if(sections)return sections;
  sections=[];
  const low=hangsLow(carriage,side),tall=standsTall(carriage,side);
  for(let i=1;i<EN;i++){
    const t=(i-.5)/(EN-1);
    let bend,restFwd;
    if(low){
      bend=1.29+1.49*sstep(.08,.60,t)+.68*sstep(.64,.99,t);
      restFwd=-.27-.33*Math.sin(Math.PI*t)+1.22*sstep(.44,.98,t)+.06*side;
    }else if(tall){
      const splay=carriage==='fan'?.61:carriage==='open'?.42:.13;
      const tip=carriage==='open'?(side>0?1.39:1.73):side>0?.50:.37;
      bend=splay+.14*sstep(.04,.48,t)+tip*sstep(.57,.99,t);
      restFwd=-.54-.84*Math.sin(Math.PI*Math.min(1,t*1.65))+1.26*sstep(.31,1,t);
    }else{
      const tip=carriage==='perky'?(side>0?1.83:2.55):carriage==='tilted'?1.92:2.48;
      bend=.065+tip*sstep(side>0?.06:.16,.88,t);
      restFwd=-.96+2.13*sstep(.28,.94,t);
    }
    sections[i]={t,fold:sstep(side>0?.47:.62,1,t),outward:Math.sin(bend)*.82,
      up:Math.cos(bend),forward:restFwd,spread:.18+.16*Math.sin(t*Math.PI)};
  }
  earRestCache.set(key,sections);return sections;
}
function stepEars(dt,initial=false){
  const r=rabbit,speed=Math.hypot(r.vx,r.vy),spin=r.spin>0;
  const linkLength=earLinkLength(), carriage=skinOf(PREV_SKIN || SAVE.skin).ears;
  const run=clamp(speed/155,0,1), targetUp=spin?0:1-run;
  r.earUp+=(targetUp-r.earUp)*(1-Math.exp(-dt*(targetUp<r.earUp?11:6)));
  const yaw=r.yaw-r.twirl,forwardX=Math.sin(yaw),forwardY=Math.cos(yaw);
  const backX=speed>6?-r.vx/speed:-forwardX, backY=speed>6?-r.vy/speed:-forwardY;
  const gait=r.gait*TAU, spinAge=r.spinSpan-r.spin;
  const swing=spin?sstep(.055,.21,spinAge)*(1-sstep(r.spinSpan-.19,r.spinSpan,spinAge)):0;
  for(const e of ears){
    const side=e.side, sx=-Math.cos(yaw)*side,sy=Math.sin(yaw)*side;
    const base=earBase(side),nodes=e.pts;
    const sections=restSections(carriage,side),droop=RA.earDrp;
    const flick=RA.flickPh>0 && side===RA.flickSide?Math.sin((1-RA.flickPh/.4)*Math.PI):0;
    for(const p of nodes){p.px=p.x;p.py=p.y;}
    nodes[0].x=base.x;nodes[0].y=base.y;nodes[0].h=base.h;
    for(let i=1;i<EN;i++){
      const p=nodes[i],rest=sections[i],t=rest.t,fold=rest.fold;
      const restSide=rest.outward+t*(flick*.17+droop*.12);
      const restFwd=rest.forward+.035*Math.sin(gtime*3-t*2+side);
      const runTilt=.82-.75*t+.12*Math.cos(gait-t*2.3+side*.65);
      const spread=rest.spread+.08*Math.sin(gait*.5-t*2+side);
      const down=1-r.earUp;
      let x=r.earUp*(sx*restSide+forwardX*restFwd)+down*(backX*Math.cos(runTilt)+sx*spread);
      let y=r.earUp*(sy*restSide+forwardY*restFwd)+down*(backY*Math.cos(runTilt)+sy*spread);
      let h=r.earUp*(rest.up-droop*.35)+down*Math.sin(runTilt);
      if(swing>0){
        const beat=spinAge*10+side*1.5;
        const curl=fold*(.63+.43*Math.sin(beat-t*2));
        const layback=r.spinDir*(.12+.46*t+curl+(side>0?.26:.02)+.14*Math.sin(beat+t*2));
        const c=Math.cos(layback),s=Math.sin(layback);
        x+=(sx*c+sy*s-x)*swing;y+=(sy*c-sx*s-y)*swing;
        const wave=.04+.67*Math.sin(beat-t*2.7)*(.42+.58*t)-.48*fold;
        h+=(wave-h)*swing;
      }
      h+=Math.sin(t*Math.PI)*r.recoil*.48;
      const mag=Math.hypot(x,y,h)||1;
      const follow=initial?1:1-Math.exp(-dt*(spin?31-10*t:20-9*t));
      p.ux+=(x/mag-p.ux)*follow;p.uy+=(y/mag-p.uy)*follow;p.uh+=(h/mag-p.uh)*follow;
      const norm=Math.hypot(p.ux,p.uy,p.uh)||1;p.ux/=norm;p.uy/=norm;p.uh/=norm;
      placeEarLink(nodes[i-1],p,linkLength);
      if(initial){p.px=p.x;p.py=p.y;p.sp=0;}
      else p.sp=Math.hypot(p.x-p.px,p.y-p.py)/Math.max(.001,dt);
    }
    const m=nodes[3],tip=nodes[EN-1];
    e.hist.unshift({mx:m.x,my:m.y,mh:m.h,tx:tip.x,ty:tip.y,th:tip.h,sp:tip.sp});
    if(e.hist.length>7) e.hist.pop();
  }
}

const DISTRICT_PROPS=[

  ['parasol','buggy','icecream'],['sled','cocoa','snowvan']

const streetProps=new Map(), propDamage=new Map(), treeBeds=new Map();
let propRow=null;
function syncStreetProps(){
  const row=Math.floor(rabbit.y/Street.period);
  if(propRow===row) return;
  propRow=row;
  for(const items of [streetProps,treeBeds])for(const [key,p] of items)if(Math.abs(p.row-row)>2)items.delete(key);
  for(let r=row-2;r<=row+2;r++) for(let slot=0;slot<10;slot++){
    const key=r+'/'+slot, side=slot%2?1:-1;
    if(streetProps.has(key) || (propDamage.get(key)===0 && (slot<6 || treeBeds.has(key))))continue;
    const roll=hashN(r+2,slot+TM*11), idx=((r+slot)%3+3)%3;
    const tree=slot>=6, kind=tree?TREE_KINDS[TM]:DISTRICT_PROPS[TM][idx], def=PROP_TYPES[kind];
    const y=r*Street.period+(tree?(slot<8?100+roll*40:390+roll*68):
      slot<4?148+((slot*131+roll*75)%252):side*48);
    const road=Street.road(y);
    let x;
    if(tree && slot<8){
      // Keep a rabbit-width passage between the tree trunk and the storefront.
      const lot=Street.buildings(r)[side<0?0:1], face=side<0?-lot.x1:lot.x0;
      x=side*Math.min(side*road.center+road.half+9,face-BODY_CLEARANCE-def.width-30);
    }else if(tree)x=side*(476+roll*32);
    else if(slot<2)x=road.center+side*(road.half-34);
    else x=side*(slot<4?575+roll*70:464+roll*45);
    const place=Street.free(x,y,Math.max(def.width,def.depth)+3);
    if(tree)treeBeds.set(key,{row:r,...place});
    if(propDamage.get(key)===0)continue;
    const transverse=slot===4||slot===5;
    streetProps.set(key,{key,row:r,kind,def,x:place.x,y:place.y,hp:propDamage.get(key)??def.hits,
      rx:transverse?def.depth:def.width,ry:transverse?def.width:def.depth,angle:(side<0?0:Math.PI)+(transverse?Math.PI/2:0),
      shake:0,contact:false,clearTime:1,cd:0,flight:0,z:0,vz:0,vx:0,vy:0,tilt:0});

}
function propContact(body){
  for(const p of streetProps.values()){
    if(p.flight) continue;
    const rx=p.rx+21, ry=p.ry+21, dx=body.x-p.x,dy=body.y-p.y;
    if(Math.abs(dx)>=rx || Math.abs(dy)>=ry) continue;
    const dist=Math.hypot(dx/rx,dy/ry);
    if(dist>=1) continue;
    const outward=dist>.001?{x:dx/dist-dx,y:dy/dist-dy}:{x:rx,y:0};
    Street.move(body,outward.x,outward.y,BODY_CLEARANCE);
    const nx=dx/(rx*rx),ny=dy/(ry*ry),length=Math.hypot(nx,ny);
    return length?{nx:nx/length,ny:ny/length}:{nx:1,ny:0};
  }

}
function updateStreetProps(dt){
  for(const [key,p] of streetProps){
    p.cd-=dt;p.shake=Math.max(0,p.shake-dt);
    if(p.flight){
      p.flight+=dt;p.z+=p.vz*dt;p.vz-=790*dt;p.tilt+=dt*p.tumble;
      const wall=Street.move(p,p.vx*dt,p.vy*dt,p.def.width);
      if(wall.nx) p.vx*=-.28;
      if(wall.ny) p.vy*=-.28;
      if(p.z<=0){dust(p.x,p.y,3,4);streetProps.delete(key);}
    }else{
      p.clearTime=p.contact?0:p.clearTime+dt;p.contact=false;
    }
  }
}
function slapStreetProps(){
  for(const p of streetProps.values()){
    if(p.flight || Math.abs(rabbit.x-p.x)>230 || Math.abs(rabbit.y-p.y)>230) continue;
    let best=null, contact=false;
    for(const ear of ears) for(let i=3;i<EN;i++){
      const q=ear.pts[i], dx=q.x-q.px, dy=q.y-q.py;
      // Sweep each sample over the frame so a fast tip cannot skip a narrow prop.
      const t=clamp(((p.x-q.px)*dx+(p.y-q.py)*dy)/(dx*dx+dy*dy||1),0,1);
      const rad=p.def.shape==='umbrella'?27:16;
      if(q.h>Math.max(58,p.def.height+25) || Math.hypot((q.px+t*dx-p.x)/(p.rx+rad),(q.py+t*dy-p.y)/(p.ry+rad))>=1) continue;
      contact=true;
      if(q.sp>=150 && (!best || q.sp>best.sp)) best=q;
    }
    p.contact=contact;
    if(!best || p.cd>0 || Street.firstWall(rabbit,p,0)) continue;
    const dx=best.x-best.px,dy=best.y-best.py,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
    if(p.clearTime<.045 && ux*(p.lastX||0)+uy*(p.lastY||0)>-.45) continue;
    p.lastX=ux;p.lastY=uy;p.cd=.22;p.shake=.29;p.hp--;
    propDamage.set(p.key,p.hp);
    sfx.prop(p.def.material,p.hp===0);rabbit.recoil=Math.max(rabbit.recoil,.35);
    if(p.def.shape==='tree'){
      for(let leaf=0;leaf<(p.hp?3:10);leaf++)
        addPart('conf',p.x+rnd(-12,12),p.y+rnd(-9,9),p.def.height*.8,rnd(-64,64),rnd(-50,50),rnd(30,95),rnd(.48,.85),p.def.paint,4);
    }
    if(p.hp) continue;
    if(p.def.shape==='stall'){
      const seller=newPerson(p.x,p.y,0);
      seller.ch.shirt=rgb(p.def.paint);seller.ch.style=1;seller.ch.cap=rgb('#ffeabe');
      seller.hitCD=.55;seller.z=8;seller.vz=130;people.push(seller);
    }
    const speed=clamp(best.sp*.45,190,470)*(1.14-.065*p.def.hits);
    p.flight=.001;p.z=2;p.vx=ux*speed;p.vy=uy*speed;p.vz=280+speed*.23;p.tumble=(ux<0?-1:1)*(9-p.def.hits);

}

function updateRabbit(dt) {
  let [ix, iy] = (state === 'play') ? inputVec() : [0, 0];
  if (state === 'menu' && menuMode === 'demo') {   // 演示模式：自动画圈 + 周期性旋风
    demoT += dt;
    const dph = demoT % 7;                  // 前 3.6 秒站定亮相（耳朵立起），之后跑动 + 旋风
    if (dph > 3.6) { ix = Math.cos(demoT * 1.35) * 0.7; iy = Math.sin(demoT * 1.9) * 0.6; if (dph - dt <= 3.6) trySpin(); }
  }
  const slow = Math.max(0.42, 1 - 0.065 * grabN) * (SK.q > 0 ? 0.35 : 1) * (RUN.slowT>0?.53:1);
  const max = 185 * slow * PERK.speed;
  let tvx = ix * max, tvy = -iy * max * 1.25;   // 屏幕 y 反向 + 俯视角压缩补偿
  let k = Math.min(1, dt * MAPMOD.fric);
  if (SK.dash > 0) { tvx = SK.dx * 470; tvy = SK.dy * 470; k = Math.min(1, dt * 30); }       // 冲刺：强制高速
  if (state === 'menu' && menuMode === 'still') { tvx = tvy = 0; rabbit.x *= 0.9; rabbit.y *= 0.9; }
  rabbit.vx += (tvx - rabbit.vx) * k; rabbit.vy += (tvy - rabbit.vy) * k;
  const contact=Street.move(rabbit,rabbit.vx*dt,rabbit.vy*dt,BODY_CLEARANCE);
  const obstacle=state==='play'?propContact(rabbit):null;
  const nx=contact.nx || obstacle?.nx || 0, ny=contact.ny || obstacle?.ny || 0;
  const normal=Math.hypot(nx,ny), ux=nx/(normal||1),uy=ny/(normal||1);
  const impact=Math.max(0,-rabbit.vx*ux-rabbit.vy*uy);
  if(normal && impact>0){
    const sameFace=ux*rabbit.bumpX+uy*rabbit.bumpY>.75;
    const fresh=!sameFace || !rabbit.wallHeld;
    const rebound=state==='play' && fresh?impact*clamp((impact-24)/430,.06,.56):0;
    rabbit.vx+=(impact+rebound)*ux;rabbit.vy+=(impact+rebound)*uy;
    if(state==='play' && fresh){
      rabbit.bumpX=ux;rabbit.bumpY=uy;rabbit.wallHeld=true;rabbit.bumpPose=1;
      rabbit.springV+=clamp(impact/70,.22,5);
      if(impact>55){sfx.wall(impact);rabbit.recoil=Math.max(rabbit.recoil,Math.min(.95,impact/330));}
      if(SK.dash>0) SK.dash=0;
    }
  }
  if(rabbit.wallHeld && (tvx*rabbit.bumpX+tvy*rabbit.bumpY>=-1 ||
      Math.hypot(rabbit.x-rabbit.bumpAtX,rabbit.y-rabbit.bumpAtY)>72)) rabbit.wallHeld=false;
  if(normal){rabbit.bumpAtX=rabbit.x;rabbit.bumpAtY=rabbit.y;}
  // Damped deformation in simulation time. Its negative overshoot lifts the body after impact.
  rabbit.springV+=(-260*rabbit.spring-13*rabbit.springV)*dt;
  rabbit.spring=clamp(rabbit.spring+rabbit.springV*dt,-.22,.30);
  if(RUN.cordon && RUN.cordon.t>1.5) {
    const c=RUN.cordon, limit=c.half;
    if(Math.abs(rabbit.x-c.x)>limit) {
      const goal=Street.free(c.x+Math.sign(rabbit.x-c.x)*limit,rabbit.y,BODY_CLEARANCE);
      Street.move(rabbit,goal.x-rabbit.x,goal.y-rabbit.y,BODY_CLEARANCE);
    }
  }
  const sp = Math.hypot(rabbit.vx, rabbit.vy);
  rabbit.bumpPose=Math.max(0,rabbit.bumpPose-dt*4.6);

  if (rabbit.hurt > 0) rabbit.hurt -= dt;

}

/* ========== 打飞一个路人 ========== */
function knockOut(p, dx, dy, power, bowl, special=false) {
  if(p.st!==0 && p.st!==3) return;
  p.hitCD = 0.3; p.flash = 0.15;
  if(p.type===6 && !special && !bowl && rabbit.spin<=0){
    const ax=rabbit.x-p.x, ay=rabbit.y-p.y, length=Math.hypot(ax,ay)||1;
    if((Math.sin(p.facing)*ax+Math.cos(p.facing)*ay)/length>.45){
      Street.move(p,dx*6,dy*6,16); addText('格挡',p.x,p.y,52,'#bfdaee',.7); sfx.shield(); return;
    }
  }
  if(p.type===5) {p.attack=null; p.skillT=3.4;}
  rabbit.recoil=Math.max(rabbit.recoil,bowl?.25:power>690?.95:.48);
  p.hp--;
  if (p.st === 3) p.st = 0;
  if (p.hp > 0) {                                // 大叔 / Boss：踉跄一下
    const boss = p.type === 4;
    Street.move(p,dx*(boss?8:22),dy*(boss?8:22),13*p.sc); p.hitCD = 0.35;
    addText(boss ? pick(['哎哟！', '好疼！', '嗷！']) : '哎哟！', p.x, p.y, 48 * p.sc, '#fff', boss ? 1.1 : 0.9); dust(p.x, p.y, 8, 3); sfx.hit(); hitstop = Math.max(hitstop, boss ? 0.05 : 0.03);
    if (boss) onBossHit(p);
    return;
  }
  power *= PERK.power;
  const kn = clamp(power * 0.55, 260, 820);
  p.st = 1; p.vx = dx * kn + rnd(-40, 40); p.vy = dy * kn + rnd(-40, 40);
  p.yaw = Math.atan2(p.vx, p.vy); p.vz = rnd(220, 380) + power * 0.22; p.rv = (Math.random() < 0.5 ? -1 : 1) * rnd(9, 18); p.bounce = 0; p.z = Math.max(p.z, 6);
  score += p.val + (p.type === 3 ? PERK.goldV : 0); scoreDirty = true; rabbit.joy = 0.55; const crit=onKO(p);
  combo++; comboT = PERK.comboT*(RUN.mode==='endless'?runPressure().combo:1); if (combo > maxCombo) maxCombo = combo; onCombo(combo);
  sfx.hit(power,bowl); if (power > 650 && Math.random() < 0.6) sfx.fly();

  addPart('burst', p.x, p.y, 34 * p.sc, 0, 0, 0, .3, '#fff', 27 + Math.min(14, power / 90)); parts[parts.length - 1].rv = 0; parts[parts.length - 1].rot0 = rnd(-.4, .4);
  addPart('ring', p.x, p.y, 8, 0, 0, 0, .35, '#fff', 34);

  if (COMBO_WORDS[combo]) { showToast(COMBO_WORDS[combo]); sfx.combo(combo); }
}

function earHits() {
  if (rabbit.earUp > 0.5) return;
  for (const e of ears) {
    for (let i = 3; i < EN; i++) {
      const q = e.pts[i]; if (q.sp < 150) continue;
      const rad = (19 + i * 0.7) * PERK.hitR, mx = q.x - q.px, my = q.y - q.py, m = Math.hypot(mx, my) || 1;
      for (const p of people) {

function bowling() {

    const sp = Math.hypot(f.vx, f.vy); if (sp < 230) continue;

/* ========== 进入"被抬走"结局 ========== */
function enterLift() {

/* ========== 总更新 ========== */
function update(dt) {
  const realDt = dt;
  if(RUN.spotlight>0){ RUN.spotlight=Math.max(0,RUN.spotlight-dt); dt*=.52; }
  if (hitstop > 0) { hitstop -= realDt; dt *= 0.12; }
  const playing = state === 'play', menu = state === 'menu';
  gtime += dt; if (playing) ptime += dt;
  if(playing || menu)syncStreetProps();
  if(playing)updateStreetProps(dt);
  updateRabbit(dt);
  if (state === 'lifted' || (state === 'over' && RUN.lifted)) {
    liftT += dt;
    rabbit.z = 34 + 95 * Math.abs(Math.sin(liftT * 2.6)); rabbit.vx = rabbit.vy = 0;
    if (liftT < 2.2 && Math.random() < 0.55) confetti(1);
  }
  stepEars(dt);

  // 生成路人
  if(playing || menu)spawnT-=dt;
  if((playing || menu) && spawnT<=0){
    let cap, ivl;
    if(menu){cap=menuMode==='demo'?(camMode==='home'?6:16):0;ivl=.5;}
    else if (RUN.lv) {
      const W = WAVEMUL[Math.max(0, RUN.wave)] || WAVEMUL[0], bossOn = RUN.bossSpawned && !RUN.bossDead;
      cap = Math.min(88, RUN.lv.cap * MAPMOD.dens * W.cc * (bossOn ? 0.7 : 1)); ivl = RUN.lv.int * W.ci * (RUN.evT > 0 ? 0.75 : 1);
    } else { const pressure=runPressure(); cap=Math.min(88,pressure.cap*MAPMOD.dens); ivl=pressure.interval*(RUN.evT>0?.7:1); }
    if (playing && RUN.lull > 0) cap = 0;                       // 波次间的喘息时间：暂停刷人
    const alive = people.reduce((n, p) => n + ((p.st === 0 || p.st === 3) && p.type !== 4 ? 1 : 0), 0);
    if (alive < cap) { spawnPerson(false); spawnT = ivl; }
  }

  // 路人行为
  const pursuitSpeed=Math.pow(1.2,deals.reachDeal);
  grabN = 0;
  for (let i = people.length - 1; i >= 0; i--) {
    const p = people[i];
    p.hitCD -= dt; p.flash -= dt;
    if (p.st === 0) {
      const dx = rabbit.x - p.x, dy = rabbit.y - p.y, d = Math.hypot(dx, dy) || 1;
      p.ph += dt * p.sp * 0.13;
      if(playing && updateThreat(p,dt,d)) continue;
      p.pathT-=dt;
      if(p.pathT<=0 || !p.target || Math.hypot(p.target.x-p.x,p.target.y-p.y)<9){
        p.target=Street.next(p,rabbit,Math.ceil(13*p.sc)); p.pathT=.24+(p.sc%1)*.13;
      }
      const tx=p.target.x-p.x, ty=p.target.y-p.y, td=Math.hypot(tx,ty)||1, ux=tx/td, uy=ty/td;
      const wob=Math.sin(p.ph*.5)*7, velocity=p.sp*pursuitSpeed;
      let vx=ux*velocity-uy*wob, vy=uy*velocity+ux*wob;
      const drift=Math.atan2(ux,uy)-p.facing;
      p.facing+=Math.atan2(Math.sin(drift),Math.cos(drift))*Math.min(1,dt*(p.type===6?2.1:9));
      if (menu && d < 70) { vx = vy = 0; }
      Street.move(p,vx*dt,vy*dt,13*p.sc);
      if(d<(p.type===4?58:34) && playing && vulnerable() && !Street.firstWall(p,rabbit,0)){p.st=3;p.ga=Math.atan2(p.y-rabbit.y,p.x-rabbit.x);p.gr=rnd(30,40);sfx.grab();}
      if (d > 1700) { if(p.type===4){Object.assign(p,Street.free(rabbit.x,rabbit.y+590,29));p.target=null;} else people.splice(i,1); continue; }
    } else if (p.st === 3) {
      if(p.type===4 && playing && updateThreat(p,dt,36)){p.st=0;continue;}
      grabN += p.type === 4 ? 3 : 1; p.ph += dt * 9;
      Street.free(rabbit.x+Math.cos(p.ga)*p.gr,rabbit.y+Math.sin(p.ga)*p.gr,10,p);
      if (!playing) p.st = 4;
    } else if (p.st === 1) {
      const wall=Street.move(p,p.vx*dt,p.vy*dt,10);
      p.wallT=Math.max(0,p.wallT-dt);
      if(wall.nx || wall.ny){
        if(wall.nx) p.vx*=-.88;
        if(wall.ny) p.vy*=-.88;
        if(p.wallT<=0 && Math.hypot(p.vx,p.vy)>165){
          p.wallT=.62; p.vz=Math.min(55,p.vz); stars(p.x,p.y,Math.max(15,p.z),4);
          addText('砰！',p.x,p.y,Math.max(30,p.z),'#ffe2aa',.85);sfx.wall();
        }
      }
      p.z += p.vz * dt; p.vz -= 1000 * dt; p.rot += p.rv * dt;
      if (p.z <= 0) {
        p.z = 0;
        if (p.bounce < 1 && p.vz < -180) { p.vz = -p.vz * 0.38; p.bounce++; p.vx *= 0.65; p.vy *= 0.65; dust(p.x, p.y, 4, 4); }
        else { p.st = 2; p.vz = 0; p.lieT = 0; p.side = Math.random() < 0.5 ? -1 : 1; dust(p.x, p.y, 4, 5); }
      }

      if (d > 5) { p.x += dx / d * 180 * dt; p.y += dy / d * 180 * dt; p.ph += dt * 14; p.cheer = 0; }
      else { p.cheer = 1; p.ph += dt * 6; p.z = Math.abs(Math.sin(p.ph)) * 9; }
    }
  }
  // 路人互相挤开
  for (let i = 0; i < people.length; i++) {
    const a = people[i]; if (a.st !== 0) continue;
    for (let j = i + 1; j < people.length; j++) {
      const b = people[j]; if (b.st !== 0) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
      if (d2 < 400 && d2 > 0.01) { const d=Math.sqrt(d2),f=(20-d)*.5; Street.move(a,-dx/d*f,-dy/d*f,13*a.sc); Street.move(b,dx/d*f,dy/d*f,13*b.sc); }
    }
  }
  if (people.length > 160) { let k = 0; for (let i = 0; i < people.length && people.length > 150; i++) if (people[i].st === 2) { people.splice(i, 1); i--; k++; } }

  if (playing || menu) { earHits(); bowling(); }
  if(playing && rabbit.earUp<=.5) slapStreetProps();
  if (playing) gameTick(dt);
  if (state === 'win' || state === 'fail') { RUN.endT += dt; tickSpecial(dt); updatePickups(dt); }

  // 连击计时 / 震屏 / 粒子 / 飘字
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
  shake = Math.max(0, shake - dt * 1.4);
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i]; q.t += dt; if (q.t > q.life) { parts.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt; q.rot += q.rv * dt;
    if (q.type === 'dust') { q.vx *= 0.94; q.vy *= 0.94; q.vz *= 0.94; }

$('wGrid').addEventListener('click',e=>{
  const button=e.target.closest('.sk');
  if(!button || PREV_SKIN===button.dataset.id) return;
  sfx.click();PREV_SKIN=button.dataset.id;renderWard();
});
$('wDo').addEventListener('click',()=>{
  const s=skinOf(PREV_SKIN);
  if(s.id===SAVE.skin) return;
  const owned=SAVE.skins.includes(s.id);
  if(!owned && (!skinUnlockable(s) || SAVE.carrots<s.price)) return;
  sfx.click();
  if(!owned){
    SAVE.carrots-=s.price;SAVE.skins.push(s.id);checkAchs();sfx.levelup();
    bannerMsg(s.name+'加入了兔兔队伍！');
  }
  SAVE.skin=s.id;calcPerk();saveNow();refreshCounts();renderWard();
  $('wGrid').querySelector('[aria-pressed="true"]').focus({preventScroll:true});
});

const wardrobeStage=$('wStage');
let stageTop=0,stageHeight=0;
function measureWardrobeStage(){
  stageTop=wardrobeStage.offsetTop;stageHeight=wardrobeStage.clientHeight;
}
if(typeof ResizeObserver!=='undefined') new ResizeObserver(measureWardrobeStage).observe(wardrobeStage);
window.addEventListener('resize',measureWardrobeStage);
let wardrobePointer=null,dragX=0;
wardrobeStage.addEventListener('pointerdown',e=>{
  if(wardrobePointer!==null || e.button!==0) return;
  wardrobePointer=e.pointerId;dragX=e.clientX;wardrobeStage.setPointerCapture(e.pointerId);
});
wardrobeStage.addEventListener('pointermove',e=>{
  if(e.pointerId!==wardrobePointer) return;
  wardYaw+=(e.clientX-dragX)*Math.PI*1.5/wardrobeStage.clientWidth;dragX=e.clientX;
});
wardrobeStage.addEventListener('lostpointercapture',e=>{
  if(e.pointerId===wardrobePointer) wardrobePointer=null;
});
wardrobeStage.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft' || e.key==='ArrowRight'){
    e.preventDefault();wardYaw+=(e.key==='ArrowLeft'?-1:1)*Math.PI/8;
  }
});

/* ---------- 特技 / 升级 ---------- */
function renderSkl() {
  const specials=sklTab === 'sp';
  $('tabSp').classList.toggle('on', specials); $('tabSp').setAttribute('aria-pressed',String(specials));
  $('tabUp').classList.toggle('on', !specials); $('tabUp').setAttribute('aria-pressed',String(!specials));
  $('sList').classList.toggle('loadout',specials);
  let h = '';
  if (specials) {
    h = SPECIALS.map(s => {
      const own = SAVE.skills.includes(s.id), eq = SAVE.skill === s.id;
      const b = eq ? '<button class="btn sm off">已装备</button>' : own ? '<button class="btn green sm" data-a="eq" data-id="' + s.id + '">装备</button>' : '<button class="btn yel sm" data-a="buy" data-id="' + s.id + '">' + CARROT_ICON + ' ' + s.price + '</button>';
      return '<div class="li ' + (eq ? 'done' : '') + '"><div class="ic" data-skill="' + s.id + '"><i class="skillMark" aria-hidden="true"></i></div><div class="tx"><b>' + s.name + '</b><span>' + s.desc + '</span><span>冷却 ' + (s.cd * PERK0().skillCD).toFixed(1) + ' 秒</span></div>' + b + '</div>';
    }).join('');
  } else {
    h = UPGRADES.map(u => {
      const lv = SAVE.up[u.id], mx = lv >= u.max, cost = upCost(u, lv);
      return '<div class="li"><div class="ic">' + u.icon + '</div><div class="tx"><b>' + u.name + '　Lv.' + lv + '</b><span>' + u.desc(lv) + (mx ? '（已满级）' : ' → ' + u.desc(lv + 1)) + '</span><div class="pips">' + Array.from({ length: u.max }, (_, k) => '<i class="' + (k < lv ? 'f' : '') + '"></i>').join('') + '</div></div>' +
        (mx ? '<button class="btn sm off">满级</button>' : '<button class="btn yel sm" data-a="up" data-id="' + u.id + '">' + CARROT_ICON + ' ' + cost + '</button>') + '</div>';
    }).join('');
  }
  $('sList').innerHTML = h;
}
const PERK0 = () => ({ skillCD: Math.max(0.35, 1 - 0.06 * SAVE.up.cd - (skinOf(SAVE.skin).perk.skill || 0)) });
$('tabSp').addEventListener('click', () => { sklTab = 'sp'; sfx.click(); renderSkl(); });
$('tabUp').addEventListener('click', () => { sklTab = 'up'; sfx.click(); renderSkl(); });
$('sList').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a, id = b.dataset.id; sfx.click();
  if (a === 'eq') { SAVE.skill = id; }
  else if (a === 'buy') { const s = spOf(id); if (SAVE.carrots < s.price) { bannerMsg(CARROT_ICON + ' 胡萝卜不够啦'); return; } SAVE.carrots -= s.price; SAVE.skills.push(id); SAVE.skill = id; sfx.levelup(); bannerMsg('🎉 学会了特技：' + s.name); }
  else if (a === 'up') { const u = UPGRADES.find(x => x.id === id), lv = SAVE.up[id], c = upCost(u, lv); if (SAVE.carrots < c) { bannerMsg(CARROT_ICON + ' 胡萝卜不够啦'); return; } SAVE.carrots -= c; SAVE.up[id]++; sfx.levelup(); }
  calcPerk(); checkAchs(); saveNow(); refreshCounts(); renderSkl();
});

/* ---------- 成就 / 每日任务（达成后手动领取） ---------- */
function achRow(icon, name, desc, v, goal, reward, claimAttr, claimed) {
  const ready = v >= goal && !claimed;
  const right = claimed ? '<div class="pg" style="opacity:.6">✔ 已领取</div>' : ready ? '<button class="btn yel sm" ' + claimAttr + ' style="padding:8px 10px;width:76px">领取<br>' + CARROT_ICON + ' ' + reward + '</button>' : '<div class="pg">' + v + '/' + goal + '<br>' + CARROT_ICON + ' ' + reward + '</div>';
  return '<div class="li ' + (ready ? 'ready' : claimed ? 'done' : '') + '" style="' + (claimed ? 'opacity:.7' : '') + '"><div class="ic" style="' + (ready || claimed ? '' : 'filter:grayscale(1);opacity:.6') + '">' + icon + '</div><div class="tx"><b>' + name + '</b><span>' + desc + '</span>' +
    (ready || claimed ? '' : '<div class="bar2"><i style="width:' + (v / goal * 100) + '%"></i></div>') + '</div>' + right + '</div>';
}
function renderAch() {
  const D = ensureDaily();
  let total = 0, got = 0; ACHG.forEach(g => g.goals.forEach((_, i) => { total++; if (achClaimed(g, i)) got++; }));
  $('achCnt').textContent = got + '/' + total;
  const n = claimCount();
  let h = '<div class="sec">📅 每日任务<small>每天自动刷新</small></div>';
  for (let i = 0; i < 3; i++) { const q = DAILY_POOL[D.q[i]]; h += achRow('📅', '每日任务 ' + (i + 1), q.text, dailyProg(D, i), q.goal, q.reward, 'data-claim="day" data-i="' + i + '"', !!D.got[i]); }
  h += '<div class="sec">🏆 成就<small>' + got + ' / ' + total + '</small></div>';
  const rows = [];
  for (const g of ACHG) {
    let i = achTier(g), all = i < 0; if (all) i = g.goals.length - 1;
    const nm = g.name + (g.goals.length > 1 ? ' · ' + TIERN[i] : ''), v = Math.min(g.goals[i], statVal(g.stat)), rd = !all && achReady(g, i);
    rows.push({ k: rd ? 0 : all ? 2 : 1, html: achRow(g.icon, nm, g.desc(g.goals[i]), v, g.goals[i], g.rewards[i], 'data-claim="ach" data-id="' + g.id + '" data-i="' + i + '"', all) });
  }
  rows.sort((a, b) => a.k - b.k);
  h += rows.map(r => r.html).join('');
  $('achList').innerHTML = h;
  $('achAll').classList.toggle('hidden', n < 2); $('achAll').textContent = '全部领取 (' + n + ')';
}
function claimAllAch() {
  let n = 0; const D = ensureDaily();
  for (const g of ACHG) for (let i = 0; i < g.goals.length; i++) if (achReady(g, i)) n += claimAch(g.id, i);
  for (let i = 0; i < 3; i++) { const q = DAILY_POOL[D.q[i]]; if (!D.got[i] && dailyProg(D, i) >= q.goal) { D.got[i] = 1; addCarrots(q.reward); n += q.reward; } }
  if (n) { saveNow(); sfx.levelup(); bannerMsg(CARROT_ICON + ' 一共领取了 ' + n); refreshCounts(); renderAch(); }
}
$('achAll').addEventListener('click', claimAllAch);
$('achList').addEventListener('click', e => {
  const b = e.target.closest('[data-claim]'); if (!b) return; let n = 0;
  if (b.dataset.claim === 'ach') n = claimAch(b.dataset.id, +b.dataset.i);
  else { const D = ensureDaily(), i = +b.dataset.i, q = DAILY_POOL[D.q[i]]; if (!D.got[i] && dailyProg(D, i) >= q.goal) { D.got[i] = 1; addCarrots(q.reward); n = q.reward; saveNow(); } }
  if (n) { sfx.levelup(); bannerMsg(CARROT_ICON + ' 领取 +' + n); refreshCounts(); renderAch(); }
});

/* ---------- 启动 ---------- */
enterMenu('home');
prepareFoley();
</script>
</body>
</html>
